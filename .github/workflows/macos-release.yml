name: Apple Silicon macOS release assets

on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: "New Apple Silicon build tag (for example macos-v0.1.17-r1)"
        required: true
        type: string
      runner_image:
        description: "Standard ARM64 macOS image"
        required: true
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-26
  push:
    tags:
      - "macos-v*-r*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: ${{ inputs.runner_image || 'macos-15' }}
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      TZ: Asia/Seoul
    steps:
      - name: Checkout requested macOS build
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ARM64 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate Apple Silicon host and unchanged application source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUILD_TAG: ${{ inputs.build_tag }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          MACOS_BUILD_TAG="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then MACOS_BUILD_TAG="$REQUESTED_BUILD_TAG"; fi
          [[ "$MACOS_BUILD_TAG" =~ ^macos-(v[0-9]+\.[0-9]+\.[0-9]+)-r[0-9]+$ ]]
          RELEASE_TAG="${BASH_REMATCH[1]}"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          SOURCE_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- Stock.Core Stock.Avalonia
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-before.json"
          python3 - "$RUNNER_TEMP/release-before.json" <<'PY'
          import json, sys
          release=json.load(open(sys.argv[1]))
          assert not release["draft"] and not release["prerelease"]
          assert any(a["name"]=="Stock.exe" and a.get("digest") for a in release["assets"])
          PY
          printf '%s\n' "RELEASE_TAG=$RELEASE_TAG" "STOCK_SOURCE_REVISION=$SOURCE_COMMIT" "MACOS_BUILD_TAG=$MACOS_BUILD_TAG" >> "$GITHUB_ENV"
          dotnet --info

      - name: Build and verify Mac core, UI, design and isolated Keychain
        shell: bash
        run: |
          set -euo pipefail
          dotnet build STOCK.Avalonia.sln -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          pwsh -File avalonia-scripts/verify-core-manifest.ps1
          dotnet run --project Stock.Portable.Tests -c Release --no-build
          dotnet run --project Stock.Desktop.Tests -c Release --no-build -- "$RUNNER_TEMP/mac-ui"
          dotnet run --project Stock.Desktop.Tests -c Release --no-build -- "$RUNNER_TEMP/mac-design" --design

      - name: Create signed app bundle, DMG and ZIP
        shell: bash
        run: |
          bash avalonia-scripts/package-macos-release.sh "$RUNNER_TEMP/stock-macos-release" "$RELEASE_TAG" "$MACOS_BUILD_TAG"

      - name: Execute native app and verify unpacked ZIP and mounted DMG
        shell: bash
        run: |
          python3 -m py_compile avalonia-scripts/verify-macos-release.py
          python3 avalonia-scripts/verify-macos-release.py "$MACOS_OUTPUT" "$RELEASE_TAG" "$MACOS_NAME"

      - name: Add only new Mac assets to existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$MACOS_OUTPUT/audit/verification.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1]))
          assert report["Success"] and report["ActualMoneyOrders"]==0
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-upload-before.json"
          python3 - "$RUNNER_TEMP/release-before.json" "$RUNNER_TEMP/release-upload-before.json" "$MACOS_NAME" <<'PY'
          import json,sys
          before,current=(json.load(open(p)) for p in sys.argv[1:3])
          old={a["name"]:a for a in before["assets"]}
          now={a["name"]:a for a in current["assets"]}
          for name in ["Stock.exe","Stock.exe.sha256"]:
              assert old[name]["id"]==now[name]["id"] and old[name].get("digest")==now[name].get("digest")
          for suffix in [".dmg",".zip",".dmg.sha256",".zip.sha256"]:
              assert sys.argv[3]+suffix not in now, "Existing assets are never overwritten"
          PY
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$MACOS_BUILD_TAG" -f "sha=$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" "$MACOS_OUTPUT/$MACOS_NAME.dmg" "$MACOS_OUTPUT/$MACOS_NAME.zip" "$MACOS_OUTPUT/$MACOS_NAME.dmg.sha256" "$MACOS_OUTPUT/$MACOS_NAME.zip.sha256"

      - name: Verify public Mac archives and execute the downloaded app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLIC_OUTPUT="$RUNNER_TEMP/public-macos-release"
          mkdir -p "$PUBLIC_OUTPUT/publish"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MACOS_NAME.*" --dir "$PUBLIC_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$PUBLIC_OUTPUT/release.json"
          python3 - "$PUBLIC_OUTPUT" "$MACOS_OUTPUT" "$MACOS_NAME" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          public,built=map(Path,sys.argv[1:3]);name=sys.argv[3]
          assets={a['name']:a for a in json.loads((public/'release.json').read_text())['assets']}
          for suffix in ['.dmg','.zip','.dmg.sha256','.zip.sha256']:
              filename=name+suffix
              actual=hashlib.sha256((public/filename).read_bytes()).hexdigest()
              assert actual==hashlib.sha256((built/filename).read_bytes()).hexdigest()
              assert assets[filename]['digest']=='sha256:'+actual
          PY
          ditto -xk "$PUBLIC_OUTPUT/$MACOS_NAME.zip" "$PUBLIC_OUTPUT/publish"
          python3 avalonia-scripts/verify-macos-release.py "$PUBLIC_OUTPUT" "$RELEASE_TAG" "$MACOS_NAME"

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AppleSilicon-${{ github.ref_name }}-verification
          path: |
            ${{ runner.temp }}/stock-macos-release/audit
            ${{ runner.temp }}/mac-ui
            ${{ runner.temp }}/mac-design
            ${{ runner.temp }}/public-macos-release/audit
            ${{ runner.temp }}/public-macos-release/release.json
          if-no-files-found: warn
